name: Release Desktop Admin (Velopack Installer & OTA Update)

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Versão SemVer do Instalador (ex.: 1.2.0)"
        required: true
        default: "1.2.0"

permissions:
  contents: write

jobs:
  publish-installer:
    name: Build Windows Installer & Publish OTA Feed
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Resolve Version
        id: vars
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $ver = "${{ github.event.inputs.version }}"
          } else {
            $ver = ("${{ github.ref_name }}").TrimStart('v', 'V')
          }
          "version=$ver" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "tag=v$ver" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Install Velopack CLI (vpk)
        run: dotnet tool install -g vpk

      - name: Build & Package CantinaAlamo-win-Setup.exe
        shell: pwsh
        run: .\scripts\pack-installer.ps1 -Version "${{ steps.vars.outputs.version }}" -UseVelopack

      - name: Publish GitHub Release (OTA Auto-Update Feed)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.tag }}
          name: "Cantina ALAMO Admin Desktop ${{ steps.vars.outputs.tag }}"
          generate_release_notes: true
          files: |
            artifacts/releases/*Setup.exe
            artifacts/releases/*.nupkg
            artifacts/releases/RELEASES
            artifacts/releases/releases.win.json
            artifacts/releases/assets.win.json
            artifacts/releases/*.zip

